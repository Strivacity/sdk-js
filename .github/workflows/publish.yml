name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for provenance data generation
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build --configuration=production

      - name: Configure
        run: |
          git config --global user.email "opensource@strivacity.com"
          git config --global user.name "strivacity"

      - name: Publish
        run: |
          STABLE=()
          PRERELEASE=()

          for f in packages/*/package.json; do
            proj=$(basename "$(dirname "$f")")
            ver=$(node -p "require('./$f').version")
            if [[ "$ver" == *-* ]]; then
              PRERELEASE+=("$proj")
            else
              STABLE+=("$proj")
            fi
          done

          if [ ${#STABLE[@]} -gt 0 ]; then
            pnpm nx release publish --projects="$(IFS=,; echo "${STABLE[*]}")" --access=public
          fi
          if [ ${#PRERELEASE[@]} -gt 0 ]; then
            pnpm nx release publish --projects="$(IFS=,; echo "${PRERELEASE[*]}")" --tag="next" --access=public
          fi
