<section>
	<sty-app-token-field type="id_token" [value]="idToken()"></sty-app-token-field>
	<sty-app-token-field type="access_token" [value]="accessToken()" [expiresAt]="expiresAt()"></sty-app-token-field>
	<sty-app-token-field type="refresh_token" [value]="refreshToken()" (refreshToken)="handleRefresh()"></sty-app-token-field>
</section>
